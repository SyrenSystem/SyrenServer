services:
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2.1.2-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  snapserver:
    build:
      context: ./deploy/snapserver
    network_mode: host
    restart: unless-stopped
    volumes:
      - snapserver-data:/var/lib/snapserver

  syren-server:
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mosquitto
      - snapserver
    volumes:
      - syren-server-state:/var/lib/syren-server

volumes:
  syren-server-state:
  snapserver-data:
