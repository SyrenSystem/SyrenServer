name: SyrenServer build pipeline

on: [push, pull_request, merge_group, workflow_dispatch]

jobs:
  snapserver:
    name: Audio recovery build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Build patched Spotify and current Snapserver
      run: docker build --pull --tag syren-snapserver-check deploy/snapserver
    - name: Check the shipped binaries
      run: |
        docker run --rm --entrypoint /usr/local/bin/librespot syren-snapserver-check --version
        docker run --rm --entrypoint /usr/bin/snapserver syren-snapserver-check --version
  build:
    name: Audio regression gate (server)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --configuration Release
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SyrenServer
        path: ./Syren.Server/bin/Release/net10.0
